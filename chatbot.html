<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroNurture - AI Assistant</title>
    <link rel="stylesheet" href="styles-global.css">

    <style>
        .chat-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 550px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            background: #f8f9fa;
        }

        .welcome-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .welcome-screen h3 {
            color: var(--primary-green);
            font-size: 24px;
            margin-bottom: 15px;
        }

        .welcome-screen p {
            color: var(--gray-600);
            margin-bottom: 25px;
        }

        .quick-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .quick-btn {
            background: white;
            border: 2px solid var(--primary-green);
            color: var(--primary-green);
            padding: 10px 18px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .quick-btn:hover {
            background: var(--primary-green);
            color: white;
            transform: translateY(-2px);
        }

        .message {
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease;
        }

        .message-user {
            text-align: right;
        }

        .message-bot {
            text-align: left;
        }

        .bubble {
            display: inline-block;
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 18px;
            line-height: 1.5;
        }

        .message-user .bubble {
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--accent-teal) 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-bot .bubble {
            background: white;
            color: var(--gray-800);
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .bot-label {
            font-size: 12px;
            color: var(--primary-green);
            margin-bottom: 5px;
            font-weight: 600;
        }

        .chat-input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid var(--gray-200);
            display: flex;
            gap: 12px;
        }

        .chat-input {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid var(--gray-300);
            border-radius: 30px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }

        .chat-input:focus {
            border-color: var(--primary-green);
        }

        .typing {
            display: none;
            padding: 10px 20px;
            color: var(--primary-green);
            font-style: italic;
            font-size: 14px;
        }

        .typing.active {
            display: block;
        }

        @media (max-width: 768px) {
            .chat-container {
                height: 450px;
            }
        }
    </style>

</head>
<body>

    <header style="background-color: #28a745; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
        <div style="flex: 1; text-align: center;">
            <h1 style="margin: 0; font-size: 24px;">AgroNurture: AI Chat Assistant</h1>
        </div>
        <a href="index.html" style="background-color: rgba(255,255,255,0.2); color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: bold; transition: all 0.3s ease;">Home</a>
    </header>

    <div class="agro-container">
        <div class="agro-card" style="padding: 0; overflow: hidden;">
            <div class="chat-container">
                <div class="chat-messages" id="chat-messages">
                    <div class="welcome-screen" id="welcome">
                        <div style="font-size: 48px; margin-bottom: 15px;">🤖</div>
                        <h3>AgroNurture AI Assistant</h3>
                        <p>Your 24/7 farming companion powered by Mistral AI</p>
                        <div class="quick-buttons">
                            <button class="quick-btn" onclick="quickAsk('What causes yellow leaves in tomatoes?')">🍅 Yellow Leaves</button>
                            <button class="quick-btn" onclick="quickAsk('Best fertilizer for wheat?')">🌾 Fertilizers</button>
                            <button class="quick-btn" onclick="quickAsk('How to control aphids?')">🐛 Pest Control</button>
                            <button class="quick-btn" onclick="quickAsk('When to irrigate rice?')">💧 Irrigation</button>
                            <button class="quick-btn" onclick="quickAsk('Soil pH for vegetables?')">🧪 Soil pH</button>
                            <button class="quick-btn" onclick="quickAsk('Crop rotation benefits?')">🔄 Rotation</button>
                        </div>
                    </div>
                    <div class="typing" id="typing">🤖 AI is typing...</div>
                </div>

                <div class="chat-input-area">
                    <input type="text" id="user-input" class="chat-input" placeholder="Ask your farming question..." autocomplete="off">
                    <button onclick="sendMessage()" id="send-btn" class="agro-btn" style="width: auto; padding: 14px 28px;">
                        📤 Send
                    </button>
                </div>
            </div>
        </div>
    </div>

    <footer class="agro-footer">
        <p><span class="agro-copyright">&copy; 2024 AgroNurture</span> - All Rights Reserved</p>
    </footer>

    <script>
        const API_KEY = "hkMqzRVK0a06E7auG24Ewjbppa5zpLug";
        const chatMessages = document.getElementById("chat-messages");
        const typingIndicator = document.getElementById("typing");

        function quickAsk(question) {
            document.getElementById("user-input").value = question;
            sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById("user-input");
            const message = input.value.trim();
            const sendBtn = document.getElementById("send-btn");

            if (!message) return;

            // Hide welcome screen on first message
            const welcome = document.getElementById("welcome");
            if (welcome) welcome.remove();

            // Add user message
            addUserMessage(message);
            input.value = "";
            sendBtn.disabled = true;
            sendBtn.textContent = "⏳";

            // Show typing
            typingIndicator.classList.add("active");
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const response = await fetch("https://api.mistral.ai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: "mistral-small-latest",
                        messages: [
                            {
                                role: "system",
                                content: "You are AgroNurture AI, an expert agricultural assistant. Provide practical, actionable advice for farmers. Use bullet points for lists. Prioritize organic solutions."
                            },
                            { role: "user", content: message }
                        ],
                        temperature: 0.7,
                        max_tokens: 800
                    })
                });

                if (!response.ok) throw new Error("API failed");

                const data = await response.json();
                const reply = data.choices[0].message.content;

                typingIndicator.classList.remove("active");
                addBotMessage(reply);

            } catch (error) {
                typingIndicator.classList.remove("active");
                addBotMessage("❌ Connection error. Please check your internet and try again.");
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = "📤 Send";
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

        function addUserMessage(text) {
            const msgDiv = document.createElement("div");
            msgDiv.className = "message message-user";
            msgDiv.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
            chatMessages.appendChild(msgDiv);
        }

        function addBotMessage(text) {
            const msgDiv = document.createElement("div");
            msgDiv.className = "message message-bot";
            msgDiv.innerHTML = `
                <div class="bot-label">🤖 AgroNurture AI</div>
                <div class="bubble">${formatMessage(text)}</div>
            `;
            chatMessages.appendChild(msgDiv);
        }

        function formatMessage(text) {
            text = text.replace(/\n/g, '<br>');
            text = text.replace(/•/g, '&bull;');
            return text;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Enter key
        document.getElementById("user-input").addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                e.preventDefault();
                sendMessage();
            }
        });

        // Welcome message
        window.onload = () => {
            setTimeout(() => {
                if (document.getElementById("welcome")) {
                    addBotMessage("Hello! 👋 I'm your AI farming assistant. Ask me anything about crops, pests, fertilizers, or soil health!");
                }
            }, 1000);
        };
    </script>

</body>
</html>
